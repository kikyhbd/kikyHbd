<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <!-- Library Canvas Confetti untuk efek taburan kertas -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Poppins', sans-serif;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        /* Screen Loading / Animasi Masuk Awal */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader-spinner {
            width: 60px; height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-screen h2 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .container {
            text-align: center; z-index: 10;
            background: rgba(255, 255, 255, 0.2);
            padding: 30px 50px; border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            opacity: 0; /* Mulai tersembunyi sebelum loading selesai */
            transform: scale(0.3) translateY(-100px);
            transition: all 1s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .container.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        h1 { color: #fff; font-size: 2rem; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        
        .click-text {
            color: #fff;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 10px;
            display: block;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .photo-container {
            width: 140px; height: 140px; margin: 5px auto 15px auto;
            border-radius: 50%; overflow: hidden;
            border: 5px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
            background: #fff;
        }
        .photo-container:hover { transform: scale(1.1); }
        
        .photo-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .cake {
            width: 100px; height: 80px;
            background: #f8a5c2; margin: 15px auto;
            border-radius: 10px 10px 0 0; position: relative;
        }
        .candle {
            position: absolute; top: -40px; left: 46px;
            width: 8px; height: 30px; background: #f1c40f;
        }
        .flame {
            position: absolute; top: -15px; left: 0px;
            width: 8px; height: 12px; background: #ff7675;
            border-radius: 50%; animation: blink 0.5s infinite;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .flame.out {
            display: none;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Tombol Tiup Lilin */
        .btn-tiup {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
            margin-top: 5px;
        }
        .btn-tiup:hover { background-color: #ff5252; transform: scale(1.05); }
        .btn-tiup:active { transform: scale(0.95); }

        /* Balon Melayang */
        .balloon {
            position: absolute; bottom: -150px;
            width: 40px; height: 50px; border-radius: 50%;
            animation: flyUp 8s infinite ease-in; z-index: 1;
        }
        @keyframes flyUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Layar Animasi Loading Masuk -->
    <div id="loading-screen">
        <div class="loader-spinner"></div>
        <h2>Memuat Kejutan...</h2>
    </div>

    <div class="container" id="main-container">
        <h1>HBD MUHAMMAD RAMADAN RIZKY PUTRA</h1>
        
        <a href="https://whatsapp.com/channel/0029Vb6ME8Y0lwgn8EuA4F0l" target="_blank" style="text-decoration:none;">
            <span class="click-text">KLIK FOTO INI</span>
            <div class="photo-container">
                <img src="231021_2.jpg" alt="Foto Ulang Tahun" fetchpriority="high">
            </div>
        </a>

        <div class="cake">
            <div class="candle">
                <div class="flame" id="flame" onclick="tiupLilin()"></div>
            </div>
        </div>

        <button class="btn-tiup" onclick="tiupLilin()">🎂 Tiup Lilin & Confetti!</button>
        <p style="color:white; font-size: 1.1rem; font-weight: bold; margin-top: 10px;">DIET OO KIKY</p>
    </div>

    <!-- Balon -->
    <div class="balloon" style="left: 10%; background: #ff6b6b; animation-duration: 7s;"></div>
    <div class="balloon" style="left: 30%; background: #feca57; animation-duration: 9s; animation-delay: 2s;"></div>
    <div class="balloon" style="left: 60%; background: #48dbfb; animation-duration: 6s;"></div>
    <div class="balloon" style="left: 85%; background: #1dd1a1; animation-duration: 10s; animation-delay: 1s;"></div>

    <script>
        // Simulasi Loading Masuk, lalu memunculkan konten utama bersamaan dengan confetti & suara
        window.onload = function() {
            setTimeout(function() {
                const loadingScreen = document.getElementById('loading-screen');
                const mainContainer = document.getElementById('main-container');

                // Hilangkan layar loading
                loadingScreen.style.opacity = '0';
                loadingScreen.style.visibility = 'hidden';

                // Tampilkan container utama dengan animasi masuk
                mainContainer.classList.add('show');

                // Jalankan suara dan confetti setelah loading selesai
                triggerConfettiAndSound();
            }, 1500); // Durasi loading 1.5 detik
        };

        function triggerConfettiAndSound() {
            playPopSound();

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function tiupLilin() {
            const flame = document.getElementById('flame');
            if (!flame.classList.contains('out')) {
                flame.classList.add('out');
                playHissSound(); 
                
                confetti({
                    particleCount: 80,
                    spread: 100,
                    origin: { y: 0.7 }
                });
            }
        }

        function playPopSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function playHissSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 0.4;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 1000;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch(e) {}
        }
    </script>
</body>
</html>
