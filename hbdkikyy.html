<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <!-- Library Canvas Confetti untuk efek taburan kertas -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* --- Reset Dasar --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Poppins', sans-serif;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        /* --- Elemen Dekorasi Background Melayang --- */
        .bg-deco {
            position: absolute;
            font-size: 1.5rem;
            animation: floatDeco 6s infinite ease-in-out alternate;
            opacity: 0.6;
            z-index: 1;
        }
        @keyframes floatDeco {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(15deg); }
        }

        /* --- Layar Animasi Loading Masuk --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader-spinner {
            width: 60px; height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-screen h2 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* --- Container Utama --- */
        .container {
            text-align: center; z-index: 10;
            background: rgba(255, 255, 255, 0.25);
            padding: 30px 45px; border-radius: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.6);
            opacity: 0; /* Mulai transparan */
            transform: scale(0.3) translateY(-100px); /* Mulai kecil dan di atas */
            transition: all 1s cubic-bezier(0.68, -0.55, 0.27, 1.55); /* Animasi masuk */
            position: relative;
        }

        .container.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* --- Tulisan "IX B" di keempat sudut --- */
        .badge-corner {
            position: absolute;
            background: #ff4757;
            color: white;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            letter-spacing: 1px;
            border: 2px solid #fff;
            animation: bounceBadge 2s infinite ease-in-out;
        }
        .badge-tl { top: -15px; left: -15px; transform: rotate(-10deg); }
        .badge-tr { top: -15px; right: -15px; transform: rotate(10deg); }
        .badge-bl { bottom: -15px; left: -15px; transform: rotate(10deg); }
        .badge-br { bottom: -15px; right: -15px; transform: rotate(-10deg); }

        @keyframes bounceBadge {
            0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(-5px) rotate(var(--rot, 0deg)); }
        }

        h1 { color: #fff; font-size: 1.8rem; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        
        .click-text {
            color: #fff;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 8px;
            display: block;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            font-size: 0.85rem;
        }

        .photo-container {
            width: 130px; height: 130px; margin: 5px auto 15px auto;
            border-radius: 50%; overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
            background: #fff;
            position: relative;
        }
        .photo-container:hover { transform: scale(1.1); }
        
        .photo-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* --- Fallback Teks jika gambar profil belum ada --- */
        .photo-fallback {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffeaa7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #d63031;
            font-size: 0.75rem;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            z-index: 1;
        }

        /* --- Kue dan Lilin --- */
        .cake {
            width: 120px; height: 75px;
            background: linear-gradient(135deg, #ff7675, #fab1a0);
            margin: 25px auto 10px auto;
            border-radius: 12px 12px 0 0; position: relative;
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.15);
        }
        
        .cake::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 24px;
            background: #fff; border-radius: 12px 12px 8px 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .topping-dripping {
            position: absolute;
            top: 20px; left: 10px; right: 10px; height: 10px;
            background: radial-gradient(circle, #fff 60%, transparent 61%);
            background-size: 15px 15px;
            z-index: 2;
        }

        .cherry {
            position: absolute; top: -6px; left: 55%;
            width: 14px; height: 14px; background: #d63031;
            border-radius: 50%; z-index: 3;
            box-shadow: inset -2px -2px 0px rgba(0,0,0,0.3);
        }

        .candle {
            position: absolute; top: -45px; left: 50px;
            transform: translateX(-50%);
            width: 10px; height: 45px; 
            background: repeating-linear-gradient(45deg, #0984e3, #0984e3 8px, #fff 8px, #fff 16px);
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 4;
        }

        .wick {
            position: absolute; top: -6px; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 8px; background: #333;
        }

        /* Api Lilin HD & Dinamis */
        .flame {
            position: absolute; top: -28px; left: 50%;
            transform: translateX(-50%);
            width: 16px; height: 24px; 
            background: linear-gradient(to top, #ff4757, #ffa502, #fffa65);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            box-shadow: 0 0 12px #ff4757, 0 0 24px #ffa502, inset 0 2px 4px rgba(255,255,255,0.6);
            animation: flameFlicker 0.4s infinite alternate ease-in-out;
            cursor: pointer;
            transform-origin: bottom center;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 5;
        }

        @keyframes flameFlicker {
            0% { transform: translateX(-50%) scale(1) rotate(-3deg); }
            50% { transform: translateX(-50%) scale(1.08) rotate(2deg) skewX(2deg); }
            100% { transform: translateX(-50%) scale(0.95) rotate(-1deg); }
        }

        .flame.out {
            opacity: 0;
            transform: translateX(-50%) scale(0) !important;
            pointer-events: none;
        }

        .btn-tiup {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .btn-tiup:hover { background-color: #ff5252; transform: scale(1.05); }
        .btn-tiup:active { transform: scale(0.95); }

        /* --- Balon Melayang --- */
        .balloon {
            position: absolute; bottom: -150px;
            width: 40px; height: 50px; border-radius: 50%;
            animation: flyUp 8s infinite ease-in; z-index: 1;
        }
        @keyframes flyUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }
    </style>
</head>
