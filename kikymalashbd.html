<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <!-- Library Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Poppins', sans-serif;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        /* Elemen Dekorasi Background Melayang */
        .bg-deco {
            position: absolute;
            font-size: 1.5rem;
            animation: floatDeco 6s infinite ease-in-out alternate;
            opacity: 0.6;
            z-index: 1;
        }
        @keyframes floatDeco {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(15deg); }
        }

        /* Screen Loading / Animasi Masuk Awal */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader-spinner {
            width: 60px; height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-screen h2 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .container {
            text-align: center; z-index: 10;
            background: rgba(255, 255, 255, 0.3);
            padding: 25px 40px; border-radius: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.6);
            opacity: 0;
            transform: scale(0.3) translateY(-100px);
            transition: all 1s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            position: relative;
            max-width: 90vw;
        }

        .container.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Tulisan Kelas "IX B" di sekitar kotak utama */
        .badge-corner {
            position: absolute;
            background: #ff4757;
            color: white;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            letter-spacing: 1px;
            border: 2px solid #fff;
            animation: bounceBadge 2s infinite ease-in-out;
            z-index: 5;
        }
        .badge-tl { top: -15px; left: -15px; transform: rotate(-10deg); }
        .badge-tr { top: -15px; right: -15px; transform: rotate(10deg); }
        .badge-bl { bottom: -15px; left: -15px; transform: rotate(10deg); }
        .badge-br { bottom: -15px; right: -15px; transform: rotate(-10deg); }

        @keyframes bounceBadge {
            0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(-5px) rotate(var(--rot, 0deg)); }
        }

        /* Gaya untuk tulisan PINTAR TAPI MALAS */
        .sub-title {
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.25);
            background: rgba(255, 107, 107, 0.5);
            padding: 4px 12px;
            border-radius: 15px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 { color: #fff; font-size: 1.6rem; margin-bottom: 4px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        
        /* Gaya untuk tulisan NUSAH MALAS OO KIKY di bawah HBD */
        .sub-greeting {
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 10px;
            border-radius: 15px;
            display: inline-block;
        }

        .click-text {
            color: #fff;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 5px;
            display: block;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            font-size: 0.75rem;
        }

        .photo-container {
            width: 110px; height: 110px; margin: 2px auto 10px auto;
            border-radius: 50%; overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
            background: #fff;
            position: relative;
        }
        .photo-container:hover { transform: scale(1.1); }
        
        .photo-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .cake {
            width: 110px; height: 65px;
            background: linear-gradient(135deg, #ff7675, #fab1a0);
            margin: 15px auto 8px auto;
            border-radius: 12px 12px 0 0; position: relative;
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.15);
        }
        
        .cake::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 20px;
            background: #fff; border-radius: 12px 12px 8px 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .topping-dripping {
            position: absolute;
            top: 18px; left: 10px; right: 10px; height: 8px;
            background: radial-gradient(circle, #fff 60%, transparent 61%);
            background-size: 15px 15px;
            z-index: 2;
        }

        .cherry {
            position: absolute; top: -6px; left: 55%;
            width: 12px; height: 12px; background: #d63031;
            border-radius: 50%; z-index: 3;
            box-shadow: inset -2px -2px 0px rgba(0,0,0,0.3);
        }

        .candle {
            position: absolute; top: -40px; left: 50px;
            transform: translateX(-50%);
            width: 8px; height: 40px; 
            background: repeating-linear-gradient(45deg, #0984e3, #0984e3 8px, #fff 8px, #fff 16px);
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 4;
        }

        .wick {
            position: absolute; top: -5px; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 6px; background: #333;
        }

        .flame {
            position: absolute; top: -24px; left: 50%;
            transform: translateX(-50%);
            width: 14px; height: 20px; 
            background: linear-gradient(to top, #ff4757, #ffa502, #fffa65);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            box-shadow: 0 0 12px #ff4757, 0 0 24px #ffa502, inset 0 2px 4px rgba(255,255,255,0.6);
            animation: flameFlicker 0.4s infinite alternate ease-in-out;
            cursor: pointer;
            transform-origin: bottom center;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 5;
        }

        @keyframes flameFlicker {
            0% { transform: translateX(-50%) scale(1) rotate(-3deg); }
            50% { transform: translateX(-50%) scale(1.08) rotate(2deg) skewX(2deg); }
            100% { transform: translateX(-50%) scale(0.95) rotate(-1deg); }
        }

        .flame.out {
            opacity: 0;
            transform: translateX(-50%) scale(0) !important;
            pointer-events: none;
        }

        .btn-tiup {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 7px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
            margin-top: 6px;
        }
        .btn-tiup:hover { background-color: #ff5252; transform: scale(1.05); }
        .btn-tiup:active { transform: scale(0.95); }

        .balloon {
            position: absolute; bottom: -150px;
            width: 40px; height: 50px; border-radius: 50%;
            animation: flyUp 8s infinite ease-in; z-index: 1;
        }
        @keyframes flyUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-deco" style="top: 10%; left: 10%; animation-delay: 0s;">⭐</div>
    <div class="bg-deco" style="top: 20%; right: 15%; animation-delay: 1s;">🎉</div>
    <div class="bg-deco" style="bottom: 15%; left: 12%; animation-delay: 2s;">🎈</div>
    <div class="bg-deco" style="bottom: 25%; right: 10%; animation-delay: 1.5s;">✨</div>

    <!-- Layar Loading -->
    <div id="loading-screen">
        <div class="loader-spinner"></div>
        <h2>Memuat Kejutan...</h2>
    </div>

    <div class="container" id="main-container">
        <!-- Tulisan Sudut -->
        <div class="badge-corner badge-tl" style="--rot: -10deg;">IX B</div>
        <div class="badge-corner badge-tr" style="--rot: 10deg;">IX B</div>
        <div class="badge-corner badge-bl" style="--rot: 10deg;">IX B</div>
        <div class="badge-corner badge-br" style="--rot: -10deg;">IX B</div>

        <!-- Tulisan PINTAR TAPI MALAS di atas HBD -->
        <div class="sub-title">✨ PINTAR TAPI MALAS ✨</div>
        <h1>HBD MUHAMMAD RAMADAN RIZKY PUTRA</h1>
        <!-- Tulisan NUSAH MALAS OO KIKY di bawah HBD -->
        <div class="sub-greeting">NUSAH MALAS OO KIKY</div>
        
        <a href="https://whatsapp.com/channel/0029Vb6ME8Y0lwgn8EuA4F0l" target="_blank" style="text-decoration:none;">
            <span class="click-text">KLIK FOTO INI UNTUK MELIHAT</span>
            <div class="photo-container">
                <img src="231021_2.jpg" alt="Foto Ulang Tahun">
            </div>
        </a>

        <div class="cake">
            <div class="topping-dripping"></div>
            <div class="cherry"></div>
            <div class="candle">
                <div class="wick"></div>
                <div class="flame" id="flame" onclick="toggleLilin()"></div>
            </div>
        </div>

        <button class="btn-tiup" onclick="toggleLilin()">🎂 Tiup / Nyalakan Lilin!</button>
        <p style="color:white; font-size: 0.95rem; font-weight: bold; margin-top: 8px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">DIET OO KIKY</p>
    </div>

    <div class="balloon" style="left: 10%; background: #ff6b6b; animation-duration: 7s;"></div>
    <div class="balloon" style="left: 30%; background: #feca57; animation-duration: 9s; animation-delay: 2s;"></div>
    <div class="balloon" style="left: 60%; background: #48dbfb; animation-duration: 6s;"></div>
    <div class="balloon" style="left: 85%; background: #1dd1a1; animation-duration: 10s; animation-delay: 1s;"></div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingScreen = document.getElementById('loading-screen');
                const mainContainer = document.getElementById('main-container');
                
                loadingScreen.style.opacity = '0';
                loadingScreen.style.visibility = 'hidden';
                
                mainContainer.classList.add('show');

                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }, 800);
        });

        function toggleLilin() {
            const flame = document.getElementById('flame');
            flame.classList.toggle('out');

            if (flame.classList.contains('out')) {
                confetti({
                    particleCount: 150,
                    spread: 100,
                    origin: { y: 0.7 }
                });
            }
        }
    </script>
</body>
</html>
